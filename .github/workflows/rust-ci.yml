name: Rust CI
'on':
  push:
    branches:
    - main
  pull_request: null
  workflow_dispatch: null
  schedule:
  - cron: 0 14 * * 1
jobs:
  rust-ci:
    uses: IronCoreLabs/workflows/.github/workflows/rust-ci.yaml@rust-ci-v2.0.0
    with:
      run_clippy: true
      minimum_coverage: "0"
      # `cargo test` does not build bench targets, so benches/ can break against a uniffi upgrade
      # without CI noticing. Build with --all-targets to compile them.
      test_matrix_include: '[{"rust_version": "", "build_only": false, "build_args": "--all-targets"}]'
      cargo_command_env_vars: "PATH=$JAVA_HOME_25_X64/bin:$PATH JDK_JAVA_OPTIONS=--enable-native-access=ALL-UNNAMED"
    secrets: inherit
